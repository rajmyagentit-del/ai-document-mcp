[project]
name = "ai-document-mcp"
version = "0.1.0"
description = "Production-hardened document ingestion & hybrid RAG MCP server with contextual and agentic retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "anthropic>=0.40",
    "starlette>=0.37",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_document_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "costs_money: test makes real Anthropic API and/or Chroma Cloud calls; excluded from default runs",
]
addopts = "-m 'not costs_money'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
